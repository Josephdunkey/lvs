# fast —— 日常分层的 PR 门禁：不跑真 ffmpeg / 真子进程 / e2e（AGENTS.md 第 9/10 条）。
#
# 本地等价命令：
#   ./.venv/Scripts/python.exe -m pytest -m "not slow and not gpu"
#
# 分层口径见 pyproject.toml [tool.pytest.ini_options].markers。
name: fast

on:
  push:
    branches: [master]        # 默认分支：git branch --show-current = master
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装（dev extra 只含 pytest，覆盖率工具不在里面）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 日常分层测试（fast 组，约 1233 例 / ≈96 s）
        run: python -m pytest -m "not slow and not gpu"
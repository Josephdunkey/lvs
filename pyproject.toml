[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longvideostudio"
version = "0.1.0"
description = "LongVideoStudio —— 把长视频拍摄稿逐分镜变成成片（CLI: lvs）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
# ---- 按"能干哪件事"分组：装哪个 extras 决定哪条路能走 --------------------------
#
# ★ 为什么必须补全（2026-10-05 审查 E03）：原先 dependencies 只有 `tomli`，
#   而代码里真有 7 个第三方 import（Pillow / numpy / flask / tomlkit / requests /
#   imageio-ffmpeg / opencv-python）。干净环境 `pip install -e .` 之后
#   `lvs graphic` / `lvs gui` / `lvs publish` 全是 ImportError，
#   而且报的是"内部错误"，不是"请先装 X"—— 新人 30 分钟出不了活。
#
# ★ 为什么每行都写上界（同批 #9）：上界是"别在半夜自动跳大版本"的保险丝。
#   上游大版本必须先在本机跑一遍全量回归再抬。这不是"锁死版本"——
#   下界仍是能力下限，上界只挡大版本。抬上界 = 改这一行 + 跑一次全量。
tts = ["edge-tts>=6.1,<8"]
http = ["requests>=2.31,<3"]
# 本地 TTS 字幕强制对齐（重依赖，故意不进 all）
align = ["faster-whisper>=1.0,<2"]
# 图形 / 图像：`lvs graphic`（图文卡）、`lvs publish`（封面）、`lvs cast`（审阅表）、
# `lvs qc`、GUI 缩略图都要 Pillow —— 实测 6 个模块 import 它，是**事实上的核心依赖**。
image = ["Pillow>=10.0,<12", "numpy>=1.24,<3"]
# 本地生图 / 合成的 ffmpeg 退路（系统没装 ffmpeg 时用 imageio 自带的那份）
comfy = ["imageio-ffmpeg>=0.4,<1"]
# 本地图形界面
gui = ["flask>=3.0,<4", "tomlkit>=0.12,<1"]
# 质检（空镜长人 / 人物镜没脸）
qc = ["opencv-python>=4.9,<5", "numpy>=1.24,<3", "Pillow>=10.0,<12"]
# 一人开发的实际用法：全装（不含 align —— faster-whisper 是 GB 级重依赖，
# 要精确对齐字幕再单独装 `.[align]`）
all = [
    "Pillow>=10.0,<12", "numpy>=1.24,<3", "imageio-ffmpeg>=0.4,<1",
    "flask>=3.0,<4", "tomlkit>=0.12,<1", "opencv-python>=4.9,<5",
    "requests>=2.31,<3", "edge-tts>=6.1,<8",
]
dev = ["pytest>=7.4,<9"]
# 本地生成可商用 BGM（`lvs bgm`）：Stable Audio 3.0 Small-Music。
# ★ 故意不进 all：stable-audio-tools 会拖 torch/transformers（GB 级），
#   与 align 同理 —— 要配乐再单独 `pip install -e .[bgm]`。
#   权重不在 wheel 里：`lvs bgm download` 走 **ModelScope 国内镜像**（同内容、
#   非门控、不要 HF_TOKEN —— HF 上那个仓库是 gated）。
#   torch / transformers 是**直接 import**：T5Gemma 文本编码器要 transformers，
#   掩码兼容层要 torch 的版本号（见 lvs/bgm.py 顶部注释），所以必须在这里声明。
bgm = [
    "stable-audio-tools>=0.0.19,<0.1", "huggingface-hub>=0.27,<1",
    "torch>=2.0,<3", "transformers>=4.53,<5",
]


[project.scripts]
lvs = "lvs.cli:main"

# ★ 必须用 `find`（自动发现子包），**不能写死** `packages = ["lvs"]`。
#
# 实测踩过：写死 `["lvs"]` 会把 **`lvs.gui` 整个子包漏掉** ——
# `pip install` 装出来 `lvs gui` 直接不可用，而 `pip wheel` 不会报错（静默）。
# 判据：`python -m pip wheel . --no-deps` 之后，wheel 里必须**含 gui 文件**。
[tool.setuptools.packages.find]
include = ["lvs*"]

[tool.setuptools.package-data]
# 生图工作流模板是**运行时要读的数据**，必须打进包里 —— 光有 .py 不够。
"lvs" = ["../workflows/*.json"]

# ★ GUI 的模板与静态资源同样是**运行时要读的数据**（Flask 按 `lvs/gui/` 找 templates/static）。
#
# 实测（2026-10-05）：只有上面那一行时，`pip wheel .` 产出的 wheel **58 个条目里
# `lvs/gui/templates/*.html`（5 个）与 `lvs/gui/static/*`（3 个）一个都没有** ——
# 装完 `lvs gui` 每个页面都 404，而 pip 全程不报任何错（与"写死 packages 漏掉 lvs.gui" 同一类静默故障）。
# 补上这一行后 wheel 66 个条目，这 8 个资源全在。
"lvs.gui" = ["templates/*.html", "static/*"]


# ---- 测试分层（2026-10-05）---------------------------------------------------
#
# 为什么：全量 pytest 约 255–276 s，而「我改了一行、坏没坏」只需要秒级反馈 ——
# 验证成本直接决定开发成本（本项目最大一笔 token 开销就来自「跑一遍看看」）。
#
#   pytest -m "not slow and not gpu"   # 日常：跳过真 ffmpeg / 真子进程 / 真建 wheel / e2e
#   pytest                             # 全量：发布前、或改到公共底座（artifact/workspace/pipeline）时
#   pytest -m slow                     # 只跑重的（改 ffmpeg 拼接、TTS、GUI job、打包时）
#
# `slow` 的判据是**实测**（--durations），不是「看着像慢」：真跑 ffmpeg 编码、真起子进程、
# 真建 wheel、整条离线 e2e 流水线。`gpu` 留给需要本机 ComfyUI(:8188) / Qwen3-TTS(:8100)
# **在线**的用例 —— 当前一条都没有（现有测试一律用不可达端口 + placeholder 后端，故意不依赖服务），
# 先注册着，免得将来加时忘了标记、把「没起服务」误判成「测试挂了」。
[tool.pytest.ini_options]
addopts = "-q --tb=line"
markers = [
    "slow: 真跑 ffmpeg / 真起子进程 / 真建 wheel / 端到端流水线（实测 >1s 级）",
    "gpu: 需要本机 ComfyUI(:8188) 或 Qwen3-TTS(:8100) 服务在线（当前无用例）",
]